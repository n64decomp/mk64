# This file is only used for compilation
# Because u16 output is required.
# The png output in assets/courses/ is from the identical .json extraction file
# JP offsets are NOT the US ones: JP moves the path arrays to the end of the
# block, so everything after them sits 0x3A30 lower.
:config:
  segments:
    - [0x06, 0x870CF0]
  header:
    code:
    - '#include <macros.h>'
    - '#include <defines.h>'
gTLUTRainbowRoadNeonPeach:
